name = "bacevector-ingestion"
main = "dist/index.mjs"
compatibility_date = "2024-10-01"

# Bindings
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "bacevector-vectors"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bacevector-documents"
preview_bucket_name = "bacevector-documents-dev"

[[d1_databases]]
binding = "DB"
database_name = "bacevector-db"
database_id = "27c29996-b885-4f56-9d09-85b3c78adc3f"

[ai]
binding = "AI"

[vars]
ADMIN_WORKER_URL = "https://admin.bacevector.workers.dev"
CHUNK_SIZE = "512"
CHUNK_OVERLAP = "128"

[build]
command = "npm run build"

[dev]
port = 8787

[observability]
enabled = true


